<html>
  <body>
    <p id="welcome-text">Welcome</p>
    <form novalidate>
      <fieldset id="account-form">
       <legend>New Account Information</legend>
        <p>
          <input type="email" name="email" placeholder="email">
        </p>
        <p>
          <input type="text" name="country" placeholder="country">
        </p>
        <p>
          <input type="number" name="postal-code" placeholder="postal code">
        </p>
        <p>
          <input type="password" name="pass" placeholder="password">
        </p>
        <p>
          <input type="password" name="pass-confirm" placeholder="confirm pass">
        </p>
      </fieldset>
    </form>
  </body>
</html>
