<html>
  <body>
    <p 
      id="welcomeText">
      Welcome</p>
    <form novalidate>
      <fieldset 
        id="accountForm">
        <legend>New Account Information</legend>
        <p>
          <input
            class="email" 
            type="email" 
            name="email" 
            placeholder="email">
        </p>
        <div class="emailError"></div>
        <p>
          <input 
            class="country"
            type="text" 
            name="country" 
            placeholder="country">
        </p>
        <div 
          class="countryError"></div>
        <p>
          <input 
            class="postalCode"
            type="number" 
            name="postalCode" 
            placeholder="postal code" 
            pattern="[0-9]{5}">
        </p>
        <div 
          class="postalCodeError"></div>
        <p>
          <input
            class="password" 
            type="password" 
            name="pass" 
            placeholder="password">
        </p>
        <div 
          class="passwordError"></div>
        <p>
          <input 
            class="passConfirm" 
            type="password" 
            name="passConfirm" 
            placeholder="confirm pass">
        </p>
        <div 
          class="passConfirmError"></div>
        <button 
          class="submitButton">
          Submit</button>
      </fieldset>
    </form>
  </body>
</html>
